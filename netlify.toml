[build]
  command = "node scripts/netlify-build.js"
  publish = "build"

[build.environment]
  NODE_VERSION = "22"
  CI = "false"

# Owner-authorized, one-time exact-copy import. The persisted marker makes later builds no-ops.
[context.production.environment]
  CONSUMER_MODEL_SNAPSHOT_IMPORT = "2026-11-18"
  DOJO_SKILL_REVIEW_CYCLE = "2026-11-24"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  external_node_modules = ["firebase-admin", "@tursodatabase/serverless", "fast-xml-parser", "strnum"]
  included_files = [
    "docs/AGENT_HQ_OPERATING_MODEL.md",
    "docs/AGENT_HQ_DECISION_LOG.md",
    "node_modules/firebase-admin/**/*",
    "node_modules/@tursodatabase/serverless/**/*",
    "node_modules/fast-xml-parser/**/*",
    "node_modules/strnum/**/*"
  ]

# React Router is client-side. Keep the explicit Agent Ideas rewrite for clarity,
# then fall back every other non-function route to the SPA entry point.
[[redirects]]
  from = "/agent-ideas"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
