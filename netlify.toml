[build]
  command = "node scripts/netlify-build.js"
  publish = "build"

[build.environment]
  NODE_VERSION = "22"
  CI = "false"

[functions]
  directory = "netlify/functions"
  external_node_modules = ["firebase-admin"]
  included_files = ["docs/AGENT_HQ_OPERATING_MODEL.md", "docs/AGENT_HQ_DECISION_LOG.md", "node_modules/firebase-admin/**/*"]

# React Router is client-side. Keep the explicit Agent Ideas rewrite for clarity,
# then fall back every other non-function route to the SPA entry point.
[[redirects]]
  from = "/agent-ideas"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
