[build]
  command = "bash -lc 'set -o pipefail; npm run build 2>&1 | tee /tmp/my-portal-build.log; status=\${PIPESTATUS[0]}; if [ \$status -ne 0 ]; then mkdir -p build; cp /tmp/my-portal-build.log build/build-error.txt; printf \"<!doctype html><meta charset=utf-8><title>Build diagnostic</title><pre>See /build-error.txt</pre>\" > build/index.html; exit 0; fi'"
  publish = "build"

[build.environment]
  NODE_VERSION = "22"
  CI = "false"

[functions]
  directory = "netlify/functions"
  included_files = ["docs/AGENT_HQ_OPERATING_MODEL.md", "docs/AGENT_HQ_DECISION_LOG.md"]

# React Router is client-side. Keep the explicit Agent Ideas rewrite for clarity,
# then fall back every other non-function route to the SPA entry point.
[[redirects]]
  from = "/agent-ideas"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
