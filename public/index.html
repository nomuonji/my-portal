<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="./favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta
      name="description"
      content="Web site created using create-react-app"
    />
    <link rel="apple-touch-icon" href="./logo192.png" />
    <!--
      manifest.json provides metadata when the app is installed.
    -->
    <link rel="manifest" href="./manifest.json" />
    <title>My Portal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;500;700&family=Nunito:wght@400;600;700&family=Zen+Maru+Gothic:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
      .agent-ideas-entry {
        position: fixed;
        right: 18px;
        bottom: 18px;
        z-index: 1300;
        display: inline-flex;
        align-items: center;
        gap: 7px;
        padding: 9px 13px;
        border-radius: 999px;
        border: 1px solid rgba(85, 119, 232, 0.22);
        background: rgba(255, 255, 255, 0.9);
        color: #405cae;
        box-shadow: 0 8px 28px rgba(34, 64, 92, 0.16);
        backdrop-filter: blur(12px);
        text-decoration: none;
        font: 700 12px/1 system-ui, -apple-system, sans-serif;
      }
      .agent-ideas-entry:hover { transform: translateY(-1px); }
      @media (max-width: 900px) {
        .agent-ideas-entry { bottom: 68px; right: 10px; padding: 8px 11px; }
      }
    </style>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <a class="agent-ideas-entry" href="/agent-ideas" title="Agent Idea Space">✦ Agent Ideas</a>
  </body>
</html>
