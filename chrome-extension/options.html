<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>My Portal ボード保存 — 設定</title>
  <link rel="stylesheet" href="popup.css">
  <style>
    body { width: auto; max-width: 560px; margin: 32px auto; padding: 0 20px; }
    h1 { font-size: 22px; margin: 6px 0 4px; letter-spacing: -.02em; }
    p.lead { color: var(--muted); margin: 0 0 22px; font-size: 13.5px; }
    label.field { display: block; font-size: 12.5px; font-weight: 700; margin: 14px 0 6px; }
    input.text {
      width: 100%; border: 1px solid var(--rule-strong); border-radius: 8px; background: var(--surface); color: var(--ink);
      font: inherit; padding: 9px 12px; outline: none;
    }
    input.text:focus { border-color: var(--ink); box-shadow: 0 0 0 3px var(--accent-soft); }
    small { display: block; color: var(--faint); font-size: 12px; margin-top: 5px; }
    .row { display: flex; align-items: center; gap: 10px; margin-top: 20px; }
    .row button { border: 0; border-radius: 8px; background: var(--ink); color: var(--bg); font: inherit; font-weight: 700; padding: 8px 18px; cursor: pointer; }
    .row button.ghost { background: transparent; color: var(--ink); border: 1px solid var(--rule-strong); }
    ul.tips { color: var(--muted); font-size: 13px; padding-left: 18px; margin-top: 28px; }
  </style>
</head>
<body>
  <span class="eyebrow">MY PORTAL</span>
  <h1>ボード保存の設定</h1>
  <p class="lead">My Portal MCP と同じアクセスキーを使います。キーはこのChromeの中だけに保存され、同期されません。</p>

  <label class="field" for="accessKey">アクセスキー</label>
  <input class="text" id="accessKey" type="password" autocomplete="off" spellcheck="false">

  <label class="field" for="baseUrl">My Portal のURL</label>
  <input class="text" id="baseUrl" type="url" spellcheck="false">
  <small>通常は変更不要です。</small>

  <div class="row">
    <button id="saveBtn" type="button">保存して接続テスト</button>
    <span class="status" id="status" role="status"></span>
  </div>

  <ul class="tips">
    <li>文字を選んで右クリック →「My Portal に保存」</li>
    <li>ツールバーのアイコン、または <b>Alt+Shift+S</b> で保存ポップアップ（ショートカットは chrome://extensions/shortcuts で変更可）</li>
    <li>ポップアップ内は <b>⌘/Ctrl+Enter</b> で保存</li>
  </ul>
  <script type="module" src="options.js"></script>
</body>
</html>
