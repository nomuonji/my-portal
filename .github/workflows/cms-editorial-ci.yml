name: CMS editorial gate
on:
  pull_request:
    paths:
      - 'functions/characterImageStore.js'
      - 'functions/characterImageMcpTools.js'
      - 'functions/characterImageStore.test.js'
      - 'functions/publicCmsStore.js'
      - 'functions/publicCmsToolSchemas.js'
      - 'netlify/functions/mcp.mts'
      - 'scripts/public-cms-smoke.js'
      - 'functions/managerOutcome.js'
      - 'functions/managerOutcome.test.js'
      - 'functions/contextStore.js'
      - 'functions/managerRunRecovery.js'
      - 'functions/hqDispatcher.js'
      - 'scripts/hq-dispatch-smoke.js'
      - 'package.json'
      - 'docs/PUBLIC_CMS_EDITORIAL_GATE.md'
      - '.github/workflows/cms-editorial-ci.yml'
  push:
    branches: [main]
    paths:
      - 'functions/publicCmsStore.js'
      - 'functions/publicCmsToolSchemas.js'
      - 'netlify/functions/mcp.mts'
      - 'scripts/public-cms-smoke.js'
      - 'functions/managerOutcome.js'
      - 'functions/managerOutcome.test.js'
      - 'functions/contextStore.js'
      - 'functions/managerRunRecovery.js'
      - 'functions/hqDispatcher.js'
      - 'scripts/hq-dispatch-smoke.js'
      - 'package.json'
      - '.github/workflows/cms-editorial-ci.yml'
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node --check functions/characterImageStore.js
      - run: node --check functions/characterImageMcpTools.js
      - run: npm run test:character-image
      - run: node --check functions/publicCmsStore.js
      - run: node --check functions/publicCmsToolSchemas.js
      - run: npm run test:public-cms
      - run: node --check functions/managerOutcome.js
      - run: node --check functions/contextStore.js
      - run: node --check functions/managerRunRecovery.js
      - run: node --check functions/hqDispatcher.js
      - run: npm run test:hq-dispatch
      - run: npm run test:hq-outcome
