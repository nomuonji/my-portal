name: CMS editorial gate
on:
  pull_request:
    paths:
      - 'functions/explorationBaseStore.js'
      - 'functions/skillResourceResolution.js'
      - 'functions/dojoResourceEvidence.js'
      - 'functions/dojoSkillTransfer.js'
      - 'functions/dojoEvidenceGraph.js'
      - 'functions/chatSkillRelationsStore.js'
      - 'functions/mcpWorkspaceApp.js'
      - 'scripts/skill-resource-evidence-smoke.js'
      - 'scripts/skill-resource-policy-migration.js'
      - 'scripts/netlify-build.js'
      - 'functions/skillPackRegistry.js'
      - 'functions/skillPackToolSchemas.js'
      - 'functions/intelligenceSkillBridge.js'
      - 'scripts/skill-pack-migration-smoke.js'
      - 'scripts/skill-pack-version-smoke.js'
      - 'functions/explorationLoop.js'
      - 'functions/dojoArtifactReadiness.js'
      - 'functions/explorationBaseToolSchemas.js'
      - 'src/components/ExplorationBases.js'
      - 'scripts/exploration-base-smoke.js'
      - 'functions/characterImageStore.js'
      - 'functions/characterImageMcpTools.js'
      - 'functions/characterImageStore.test.js'
      - 'functions/publicCmsStore.js'
      - 'functions/publicCmsToolSchemas.js'
      - 'netlify/functions/mcp.mts'
      - 'scripts/public-cms-smoke.js'
      - 'functions/managerOutcome.js'
      - 'functions/managerOutcome.test.js'
      - 'functions/contextStore.js'
      - 'functions/worldMap.js'
      - 'functions/worldHomeGuide.js'
      - 'src/components/AgentGuidePanel.js'
      - 'functions/worldMapToolSchemas.js'
      - 'functions/chatContextRegistry.js'
      - 'functions/contextRegistry.js'
      - 'functions/contextRegistryToolSchemas.js'
      - 'src/components/ContextPanel.js'
      - 'src/components/ThinkingWorkspace.js'
      - 'functions/chatContextToolSchemas.js'
      - 'functions/chatSkillSeeds.js'
      - 'functions/chatSkillSeeds/**'
      - 'src/App.js'
      - 'src/components/WorldHome.js'
      - 'netlify/functions/agent-ideas-api.mts'
      - 'scripts/world-map-smoke.js'
      - 'functions/managerRunRecovery.js'
      - 'functions/hqDispatcher.js'
      - 'scripts/hq-dispatch-smoke.js'
      - 'package.json'
      - 'docs/PUBLIC_CMS_EDITORIAL_GATE.md'
      - '.github/workflows/cms-editorial-ci.yml'
  push:
    branches: [main]
    paths:
      - 'functions/explorationBaseStore.js'
      - 'functions/skillResourceResolution.js'
      - 'functions/dojoResourceEvidence.js'
      - 'functions/dojoSkillTransfer.js'
      - 'functions/dojoEvidenceGraph.js'
      - 'functions/chatSkillRelationsStore.js'
      - 'functions/mcpWorkspaceApp.js'
      - 'scripts/skill-resource-evidence-smoke.js'
      - 'scripts/skill-resource-policy-migration.js'
      - 'scripts/netlify-build.js'
      - 'functions/skillPackRegistry.js'
      - 'functions/skillPackToolSchemas.js'
      - 'functions/intelligenceSkillBridge.js'
      - 'scripts/skill-pack-migration-smoke.js'
      - 'scripts/skill-pack-version-smoke.js'
      - 'functions/explorationLoop.js'
      - 'functions/dojoArtifactReadiness.js'
      - 'functions/explorationBaseToolSchemas.js'
      - 'src/components/ExplorationBases.js'
      - 'scripts/exploration-base-smoke.js'
      - 'functions/publicCmsStore.js'
      - 'functions/publicCmsToolSchemas.js'
      - 'netlify/functions/mcp.mts'
      - 'scripts/public-cms-smoke.js'
      - 'functions/managerOutcome.js'
      - 'functions/managerOutcome.test.js'
      - 'functions/contextStore.js'
      - 'functions/managerRunRecovery.js'
      - 'functions/hqDispatcher.js'
      - 'scripts/hq-dispatch-smoke.js'
      - 'package.json'
      - '.github/workflows/cms-editorial-ci.yml'
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node --check functions/characterImageStore.js
      - run: node --check functions/characterImageMcpTools.js
      - run: npm run test:character-image
      - run: node --check functions/publicCmsStore.js
      - run: node --check functions/publicCmsToolSchemas.js
      - run: npm run test:public-cms
      - run: node --check functions/managerOutcome.js
      - run: node --check functions/contextStore.js
      - run: node --check functions/worldMap.js
      - run: node --check functions/worldHomeGuide.js
      - run: node --check functions/worldMapToolSchemas.js
      - run: node --check functions/chatContextRegistry.js
      - run: node --check functions/contextRegistry.js
      - run: node --check functions/contextRegistryToolSchemas.js
      - run: node --check functions/chatContextToolSchemas.js
      - run: npm run test:world-home
      - run: node scripts/turso-transaction-smoke.js # mirror Netlify build prerequisite
      - run: npx --yes esbuild@0.24.0 netlify/functions/mcp.mts --bundle --platform=node --target=node22 --format=esm --outfile=/tmp/my-portal-mcp.mjs --external:firebase-admin --external:@tursodatabase/serverless --external:fast-xml-parser --external:strnum
      - run: CI=false npm run build
      - run: node --check functions/managerRunRecovery.js
      - run: node --check functions/hqDispatcher.js
      - run: npm run test:hq-dispatch
      - run: npm run test:hq-outcome
