name: Deploy to Firebase Hosting on Push

on:
  push:
    branches:
      - main

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22' # プロジェクトのNode.jsバージョンに合わせてください

    - name: Install dependencies
      run: npm ci

    # Firebase Hosting deploys do not apply Firestore Security Rules.
    # Keep the deployed rules in sync with the committed rules for both databases.
    - name: Authenticate to Google Cloud
      uses: google-github-actions/auth@v3
      with:
        project_id: my-portal-d05fd
        credentials_json: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}'

    - name: Deploy Firestore Security Rules
      run: npx --yes firebase-tools deploy --only firestore:rules --project my-portal-d05fd --non-interactive

    - name: Build project
      run: npm run build
      env:
        REACT_APP_FIREBASE_CONFIG_JSON: ${{ secrets.FIREBASE_CONFIG_JSON }}

    - name: Deploy to Firebase Hosting
      uses: FirebaseExtended/action-hosting-deploy@v0
      with:
        firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}
        projectId: my-portal-d05fd # あなたのFirebaseプロジェクトIDに置き換えてください
        channelId: live # デプロイ先のチャンネルID (通常はlive)
