name: Deploy to Firebase Hosting on Push

on:
  push:
    branches:
      - main

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22' # プロジェクトのNode.jsバージョンに合わせてください

    - name: Install dependencies
      run: npm ci

    - name: Build project
      run: npm run build
      env:
        REACT_APP_FIREBASE_API_KEY: AIzaSyCpKln3maCKW1MQLWhOp_hgqfqZQhQcrqs
        REACT_APP_FIREBASE_AUTH_DOMAIN: my-portal-d05fd.firebaseapp.com
        REACT_APP_FIREBASE_PROJECT_ID: my-portal-d05fd
        REACT_APP_FIREBASE_STORAGE_BUCKET: my-portal-d05fd.firebasestorage.app
        REACT_APP_FIREBASE_MESSAGING_SENDER_ID: 82448283366
        REACT_APP_FIREBASE_APP_ID: 1:82448283366:web:4775ad22c0b8165e796d27
        REACT_APP_FIREBASE_MEASUREMENT_ID: G-TECM1R4GKC

    - name: Deploy to Firebase Hosting
      uses: FirebaseExtended/action-hosting-deploy@v0
      with:
        firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}
        projectId: my-portal-d05fd # あなたのFirebaseプロジェクトIDに置き換えてください
        channelId: live # デプロイ先のチャンネルID (通常はlive)
