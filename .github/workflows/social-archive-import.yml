name: Social Archive Import Transport

on:
  push:
    branches: [main]
    paths:
      - '.github/social-import-trigger.txt'

permissions:
  contents: read
  issues: write

concurrency:
  group: social-archive-import
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Import social archive bundle
        env:
          FIREBASE_SERVICE_ACCOUNT_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const zlib = require('node:zlib');
          const { cert, initializeApp } = require('firebase-admin/app');
          const store = require('./functions/socialArchiveStore.js');

          async function github(url, options = {}) {
            const response = await fetch(url, {
              ...options,
              headers: {
                Accept: 'application/vnd.github+json',
                Authorization: `Bearer ${process.env.GITHUB_TOKEN}`,
                'X-GitHub-Api-Version': '2022-11-28',
                'Content-Type': 'application/json',
                ...(options.headers || {}),
              },
            });
            if (!response.ok) {
              throw new Error(`GitHub API failed: ${response.status} ${await response.text()}`);
            }
            return response.status === 204 ? null : response.json();
          }

          async function main() {
            const issueNumber = fs.readFileSync('.github/social-import-trigger.txt', 'utf8').trim();
            if (!/^\d+$/.test(issueNumber)) throw new Error('Invalid issue number in trigger file');

            const issueUrl = `https://api.github.com/repos/${process.env.GITHUB_REPOSITORY}/issues/${issueNumber}`;
            const issue = await github(issueUrl);
            if (!String(issue.title || '').startsWith('[social-import]')) {
              throw new Error('Refusing non social-import issue');
            }

            const rawSecret = process.env.FIREBASE_SERVICE_ACCOUNT_KEY || '';
            if (!rawSecret) throw new Error('FIREBASE_SERVICE_ACCOUNT_KEY is not configured');
            const serviceAccount = JSON.parse(rawSecret);
            initializeApp({
              credential: cert(serviceAccount),
              projectId: serviceAccount.project_id || 'my-portal-d05fd',
            });

            const encoded = String(issue.body || '').trim();
            if (!encoded) throw new Error('Issue body is empty');
            const decoded = zlib.gunzipSync(Buffer.from(encoded, 'base64')).toString('utf8');
            const payloads = JSON.parse(decoded);
            if (!Array.isArray(payloads) || !payloads.length) throw new Error('Bundle must contain payloads');

            for (const payload of payloads) {
              const result = await store.importPosts({ ...payload, confirm: true });
              console.log(JSON.stringify({
                importKey: result.importKey,
                received: result.received,
                created: result.created,
                updated: result.updated,
                complete: result.complete,
              }));
            }

            await github(issueUrl, {
              method: 'PATCH',
              body: JSON.stringify({
                body: '[payload redacted after successful social archive import]',
                state: 'closed',
              }),
            });
          }

          main().catch((error) => {
            console.error(error instanceof Error ? error.message : String(error));
            process.exit(1);
          });
          NODE
