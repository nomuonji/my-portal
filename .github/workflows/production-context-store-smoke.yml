name: Production Context Store Smoke

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify production UI and MCP health
        shell: bash
        run: |
          set -euo pipefail

          curl --fail --silent --show-error --location \
            --retry 6 --retry-delay 5 --retry-all-errors \
            https://my-portal-agent.netlify.app/ >/dev/null

          for attempt in $(seq 1 24); do
            body="$(curl --fail --silent --show-error --location \
              https://my-portal-agent.netlify.app/mcp/health 2>/dev/null || true)"

            if [ -n "$body" ]; then
              echo "$body" | jq .

              ok="$(echo "$body" | jq -r '.ok // false' 2>/dev/null || echo false)"
              version="$(echo "$body" | jq -r '.serverVersion // ""' 2>/dev/null || true)"
              tool_count="$(echo "$body" | jq -r '.toolCount // 0' 2>/dev/null || echo 0)"
              context_ok="$(echo "$body" | jq -r '.contextStore.database.ok // false' 2>/dev/null || echo false)"

              required_tools=(
                space_search
                space_get_context
                profile_get_context
                profile_fact_upsert
                decision_create
                opportunity_create
                space_distill_run
              )

              tools_ok=true
              for tool in "${required_tools[@]}"; do
                if ! echo "$body" | jq -e --arg tool "$tool" '.tools | index($tool) != null' >/dev/null 2>&1; then
                  tools_ok=false
                  break
                fi
              done

              if [ "$ok" = "true" ] \
                && [ "$version" = "0.5.0-netlify" ] \
                && [ "$tool_count" -ge 33 ] \
                && [ "$context_ok" = "true" ] \
                && [ "$tools_ok" = "true" ]; then
                echo "Production Context Store smoke check passed."
                exit 0
              fi
            fi

            sleep 10
          done

          echo "Production did not expose the expected Context Store contract."
          exit 1
