name: Bootstrap Agent Idea Space

on:
  workflow_dispatch:

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install app dependencies
        run: npm ci

      - name: Build app
        run: npm run build
        env:
          REACT_APP_FIREBASE_CONFIG_JSON: ${{ secrets.FIREBASE_CONFIG_JSON }}

      - name: Install function dependencies
        run: npm ci --prefix functions

      - name: Validate Cloud Functions
        run: npm --prefix functions run lint

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}

      - name: Install Firebase CLI
        run: npm install --global firebase-tools

      - name: Ensure named Firestore database exists
        shell: bash
        run: |
          set +e
          OUTPUT=$(firebase firestore:databases:create agent-ideas \
            --location=asia-northeast1 \
            --delete-protection=ENABLED \
            --project=my-portal-d05fd \
            --non-interactive 2>&1)
          STATUS=$?
          set -e
          if [ "$STATUS" -ne 0 ]; then
            if echo "$OUTPUT" | grep -qiE 'already exists|ALREADY_EXISTS'; then
              echo "agent-ideas already exists; continuing."
            else
              echo "$OUTPUT"
              exit "$STATUS"
            fi
          else
            echo "$OUTPUT"
          fi

      - name: Deploy Agent Idea Space backend and hosting rewrites
        run: firebase deploy --only firestore,functions:agentIdeasMcp,hosting --project=my-portal-d05fd --non-interactive
